apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-lab-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:aerojagi/home-k8s-gitops.git
    targetRevision: main
    path: clusters/home-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
